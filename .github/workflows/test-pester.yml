name: Run Pester Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Pester CI
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Pester 5.x
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run tests
        shell: pwsh
        run: ./test.ps1

      - name: Parse-check under Windows PowerShell 5.1
        # The module manifest declares PowerShellVersion 5.1, so every script
        # must at least parse in 5.1. Two failure modes bit this project:
        # the PS7-only null-coalescing operators ('??', '?.'), and non-ASCII
        # characters in files saved without a UTF-8 BOM, which 5.1 decodes as
        # the system code page and can turn into a stray quote character.
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Recurse -Include *.ps1,*.psm1 -File |
            Where-Object { $_.FullName -notmatch '\\\.git\\' } |
            ForEach-Object {
              $errors = $null
              $tokens = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) {
                Write-Host "PARSE FAIL: $($_.FullName)"
                Write-Host "  $($errors[0].Message)"
                $failed = $true
              }
            }
          if ($failed) { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
